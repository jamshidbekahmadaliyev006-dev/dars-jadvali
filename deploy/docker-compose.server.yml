# Serverdagi ishga tushirish (Oracle). Boshqa loyihalarga xalaqit bermaydi:
# - alohida compose loyiha nomi (uninotify)
# - bot Telegram'dan o'zi so'raydi (long polling)
# - tashqariga faqat Caddy (80/443) ochiq va u FAQAT admin saytni (/admin, /api/v1/admin/*) o'tkazadi;
#   qolgan hamma manzil 404. Admin API har so'rovda Telegram imzosi va ADMIN_IDS'ni tekshiradi.
# - API server ichidan: 127.0.0.1:8010
# - ma'lumotlar bazasi ./data/uninotify.db (SQLite) da saqlanadi
#
# Ishga tushirish:  docker compose -p uninotify -f deploy/docker-compose.server.yml up -d --build
name: uninotify

services:
  bot:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: uninotify-bot:latest
    container_name: uninotify-bot
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/uninotify.db
      ADMIN_WEB_URL: https://149-118-57-149.sslip.io/admin
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:8010:8000"
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Eski bot (@dasrli_bot) ga yozganlarni yangi botga yo'naltiradi
  old-bot-redirect:
    image: uninotify-bot:latest
    container_name: uninotify-old-bot-redirect
    restart: unless-stopped
    depends_on: [bot]
    env_file: ../.env  # OLD_BOT_TOKEN va NEW_BOT_USERNAME shu yerdan
    command: ["python", "-u", "scripts/old_bot_redirect.py"]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Admin sayt uchun HTTPS (Let's Encrypt sertifikatini o'zi oladi va yangilaydi)
  caddy:
    image: caddy:2.8-alpine
    container_name: uninotify-caddy
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  caddy_data:
  caddy_config:
