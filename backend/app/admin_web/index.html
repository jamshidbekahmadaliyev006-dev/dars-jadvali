<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Qulay Jadval Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar + working area. Stat chips on top, then rings/donut/list, then two period charts. Other sections are tables, dialogs and a chat-style sender. */
:root{
  --bg:#08111A; --panel:#0F1B27; --panel-2:#142333; --line:#1F3346; --fg:#E8F0F5; --muted:#95A9B8;
  --accent:#34C7B8; --accent-ink:#04211E; --violet:#9B7BFF; --orange:#F0985A; --pink:#F06FAE;
  --track:#1D3144; --ok:#47D79A; --ok-bg:rgba(71,215,154,.12); --ok-line:rgba(71,215,154,.38);
  --warn:#F2C14E; --warn-bg:rgba(242,193,78,.12); --warn-line:rgba(242,193,78,.38);
  --bad:#FF8A80; --bad-bg:rgba(255,138,128,.12); --bad-line:rgba(255,138,128,.38);
  --idle:#9DB0BE; --idle-bg:rgba(157,176,190,.12); --idle-line:rgba(157,176,190,.34);
  --bubble:#16293B; --bubble-me:#0F6B63; --shadow:0 10px 30px rgba(0,0,0,.3);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#E9F0F4; --panel:#FFFFFF; --panel-2:#F1F6F9; --line:#D5E1E8; --fg:#0C1F2B; --muted:#52677A;
  --accent:#0D8A7E; --accent-ink:#FFFFFF; --violet:#5B3FD0; --orange:#C2601F; --pink:#B5266C; --track:#DCE7EE;
  --ok:#0B7A4B; --ok-bg:#E3F6EC; --ok-line:#9ED8BA; --warn:#8A5A00; --warn-bg:#FFF3D1; --warn-line:#E8CB80;
  --bad:#B3261E; --bad-bg:#FDE7E5; --bad-line:#EFB1AC; --idle:#4F626F; --idle-bg:#EAF0F4; --idle-line:#C7D4DC;
  --bubble:#EAF1F6; --bubble-me:#CFEFEA; --shadow:0 8px 24px rgba(12,31,43,.08); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#E9F0F4; --panel:#FFFFFF; --panel-2:#F1F6F9; --line:#D5E1E8; --fg:#0C1F2B; --muted:#52677A;
  --accent:#0D8A7E; --accent-ink:#FFFFFF; --violet:#5B3FD0; --orange:#C2601F; --pink:#B5266C; --track:#DCE7EE;
  --ok:#0B7A4B; --ok-bg:#E3F6EC; --ok-line:#9ED8BA; --warn:#8A5A00; --warn-bg:#FFF3D1; --warn-line:#E8CB80;
  --bad:#B3261E; --bad-bg:#FDE7E5; --bad-line:#EFB1AC; --idle:#4F626F; --idle-bg:#EAF0F4; --idle-line:#C7D4DC;
  --bubble:#EAF1F6; --bubble-me:#CFEFEA; --shadow:0 8px 24px rgba(12,31,43,.08); color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:26px;padding:22px 14px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:600;border-left:3px solid transparent}
.nav a:hover{background:var(--panel-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--panel-2);color:var(--fg);border-left-color:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.nav .badge{margin-left:auto;font-size:12px;font-weight:800;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line);padding:0 8px;border-radius:999px}
.side .sp{flex:1}
.me-box{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel-2)}
.me-box b{display:block;font-size:13.5px;line-height:1.2}
.me-box small{display:block;font-size:12px;color:var(--muted)}
.me-box .ib{margin-left:auto;width:34px;height:34px;border-radius:9px}
.me-box .ib svg{width:16px;height:16px}

.main{min-width:0;padding:18px 26px 44px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ib{position:relative;width:42px;height:42px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ib svg{width:19px;height:19px}
.ib:hover{border-color:var(--accent)}
.ib.menu-btn{display:none}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.top .grow{flex:1}
.search{position:relative;width:min(340px,38vw)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search input{width:100%;height:42px;padding:0 14px 0 39px;border-radius:11px;background:var(--panel);border:1px solid var(--line);outline:none}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.menu-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:20}
.pop h3{font-size:14px;padding:8px 10px 6px;color:var(--muted);font-weight:700}
.pop .it{display:flex;gap:10px;padding:10px;border-radius:10px;width:100%;text-align:left;background:none;border:0;align-items:flex-start}
.pop .it:hover{background:var(--panel-2)}
.pop .it small{display:block;color:var(--muted);font-size:12.5px}
.pop .it b{font-size:14px;font-weight:700;display:block}
.uni{height:42px;font-weight:700;font-size:13.5px;max-width:220px}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sec-head p{color:var(--muted);font-size:14px;margin-top:3px}

.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.chip-stat{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.chip-stat:hover{border-color:var(--accent)}
.chip-stat strong{display:block;font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.cs-l{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.cs-i{width:30px;height:30px;flex:none;color:var(--c)}
.cs-i svg{width:100%;height:100%;display:block}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:13px;margin:3px 0 16px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0;white-space:nowrap}
.link:hover{text-decoration:underline}
.row3{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr) minmax(0,4fr);gap:14px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

.rings{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap}
.ring{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:none;border:0;padding:4px;border-radius:12px}
.ring:hover .rv{color:var(--accent)}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .box{position:relative}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px}
.ring span.l{font-size:13px;font-weight:700}
.ring small{color:var(--muted);font-size:12px;margin-top:-6px}
.donut-w{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{position:relative;width:128px;height:128px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-size:24px;font-weight:800;line-height:1}
.donut .mid span{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:120px}
.legend div{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-weight:800}
.top-list{display:flex;flex-direction:column}
.tl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0;padding-top:2px}
.tl .n{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:var(--accent)}
.tl .t{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.tl .v{font-weight:800;font-size:14px;white-space:nowrap}
.tl .v small{color:var(--muted);font-weight:600;font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit:hover{opacity:.85}
.legend-inline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.per{margin-bottom:14px}
.tip{position:fixed;z-index:60;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;pointer-events:none;white-space:nowrap;transform:translate(-50%,-130%)}

.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.pill.idle{color:var(--idle);background:var(--idle-bg);border-color:var(--idle-line)}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .search{width:min(320px,100%)}
.sel{height:42px;border-radius:11px;background:var(--panel);border:1px solid var(--line);padding:0 12px;outline:none;max-width:100%}
.sel:focus{border-color:var(--accent)}
.btn{height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:var(--panel-2);color:var(--muted);font-weight:700;font-size:13px;text-align:left;padding:13px 16px;white-space:nowrap}
th button{background:none;border:0;font-weight:700;color:inherit;padding:0}
th button:hover{color:var(--fg)}
td{padding:13px 16px;border-top:1px solid var(--line);font-size:14px}
td.num,th.num{text-align:right}
td b{font-weight:800}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.pager .pg{display:flex;gap:6px}
.empty{padding:34px 12px;text-align:center;color:var(--muted)}
.loading{padding:60px 12px;text-align:center;color:var(--muted)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px}
.chip b{color:var(--fg);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:var(--accent-ink)}
.ib .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.aud-note{font-size:13px;color:var(--muted)}
.aud-note b{color:var(--fg)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.rchip:hover{border-color:var(--accent);color:var(--accent)}
.who{display:flex;align-items:center;gap:11px}
.who b{display:block;font-weight:800;line-height:1.25}
.who small{display:block;color:var(--muted);font-size:12.5px}
.av2{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--violet));display:grid;place-items:center;font-weight:800;color:#06121a;flex:none}
.pen{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:inline-grid;place-items:center;color:var(--fg)}
.pen:hover{border-color:var(--accent);color:var(--accent)}
.pen svg{width:17px;height:17px}
.muted{color:var(--muted)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.fcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%}
.fcard:hover{border-color:var(--accent)}
.fcard svg{width:62px;height:62px;transform:rotate(-90deg);flex:none}
.fcard .rb{position:relative;flex:none}
.fcard .rb b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.fcard strong{display:block;font-size:14.5px;line-height:1.3;font-weight:800}
.fcard small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}

.chat{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:560px}
.chat-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.aud{display:flex;gap:12px;align-items:center;padding:12px 16px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.aud:hover{background:var(--panel-2)}
.aud[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
.aud .ci{min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;background:var(--panel-2);color:var(--accent);flex:none;font-weight:800;font-size:13px}
.aud b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.aud small{color:var(--muted);font-size:12.5px}
.chat-r{display:flex;flex-direction:column;min-width:0}
.chat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-h b{font-size:15px}
.chat-h small{display:block;color:var(--muted);font-size:12.5px}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:420px}
.bub{max-width:min(520px,88%);background:var(--bubble);border-radius:14px 14px 14px 4px;padding:11px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--bubble-me);border-radius:14px 14px 4px 14px}
.bub small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.sys{align-self:center;color:var(--muted);font-size:12.5px;background:var(--panel-2);padding:3px 12px;border-radius:999px}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.composer textarea,.ta{width:100%;min-height:110px;resize:vertical;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);padding:10px 12px;outline:none}
.composer textarea:focus,.ta:focus{border-color:var(--accent)}
.comp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comp-row .grow{flex:1;color:var(--muted);font-size:13px}
.datebtn{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-weight:700;color:var(--fg)}
.datebtn svg{width:18px;height:18px;color:var(--accent)}
.datebtn:hover{border-color:var(--accent)}
.cal{width:100%}
.cal h2{margin:0}
.cal-top{display:flex;gap:6px;align-items:center;margin:10px 0 6px}
.cal-top .sel{height:34px;flex:1;min-width:0;padding:0 6px;font-size:13px}
.cal-nav{width:34px;height:34px;flex:none;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;font-weight:700}
.cal-nav:hover{border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-grid .wd{font-size:11.5px;color:var(--muted);font-weight:700;padding:2px 0}
.cal-grid button{height:34px;min-height:0;padding:0;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);font-weight:600}
.cal-grid button:hover:not(:disabled){background:var(--panel-2)}
.cal-grid button.today{border-color:var(--accent)}
.cal-grid button.sel{background:var(--accent);color:var(--accent-ink)}
.cal-grid button:disabled{color:var(--muted);opacity:.4;cursor:default}
.cal-pre{display:flex;gap:6px;margin-bottom:2px}
.tot{color:var(--muted);font-size:13.5px;margin:2px 0 8px}.tot b{color:var(--fg)}
.seg{display:flex;gap:4px;padding:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.sstack{display:flex;flex-direction:column;gap:14px;max-width:720px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0 2px}
.srow b{display:block;font-size:14px}
.srow small{display:block;color:var(--muted);font-size:12.5px;max-width:380px}

dialog{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:18px;padding:0;width:min(480px,calc(100% - 32px));box-shadow:var(--shadow)}
dialog.wide{width:min(980px,calc(100% - 24px))}
dialog.narrow{width:min(320px,calc(100% - 24px));overflow:hidden}
dialog.narrow #dlgBody{padding:16px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 56px);overflow:auto}
.dlg h2{font-size:19px}
.dlg p{color:var(--muted);font-size:14px}

.dlg .kv span:first-child{color:var(--muted)}
.dlg .kv b{text-align:right;overflow-wrap:anywhere}
.rv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rv-tbl table{min-width:840px}
.rv-tbl td,.rv-tbl th{padding:10px 10px}
.cell-in{width:100%;min-width:0;height:36px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);padding:0 9px;outline:none;font-size:13.5px}
.cell-in:focus{border-color:var(--accent)}
.cell-in.t{width:72px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:80;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock .card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock h1{font-size:22px}
.lock p{color:var(--muted)}

@media (max-width:1180px){
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row3>:first-child{grid-column:1/-1}
  .row2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:268px;height:100vh;height:100dvh;transform:translateX(-102%);transition:transform .22s;padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
  .ib.menu-btn{display:grid}
  .main{padding:14px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px))}
  .search{width:auto;flex:1;min-width:0}
  .top .grow{display:none}
  .chat{grid-template-columns:minmax(0,1fr)}
  .chat-l{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .row3{grid-template-columns:minmax(0,1fr)}
  .sec-head h1{font-size:23px}
  .uni{max-width:110px}
}
@media (max-width:640px){
  .top{flex-wrap:wrap}
  .top .search{order:10;flex:1 1 100%;width:100%}
  .uni{flex:1;max-width:none}
  .pop{position:fixed;left:12px;right:12px;top:64px;width:auto;max-width:none}
  .tbl-wrap.cw{border:0;background:none;overflow:visible}
  .cards-m,.cards-m tbody,.cards-m tr,.cards-m td{display:block;min-width:0!important;width:100%}
  .cards-m thead{display:none}
  .cards-m tr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .cards-m td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right;font-size:14px}
  .cards-m td::before{content:attr(data-l);color:var(--muted);font-weight:600;font-size:13px;text-align:left;flex:none}
  .cards-m td:first-child{padding-top:0;text-align:left;justify-content:flex-start}
  .cards-m td:first-child::before,.cards-m td.num:last-child::before{display:none}
  .cards-m td.num:last-child{justify-content:flex-end;padding-top:10px}
  .cards-m td[colspan]{display:block;text-align:center}
  .dlg{padding:16px}
  .msgs{max-height:340px}
  .pager{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
var TOKEN=null;try{TOKEN=localStorage.getItem("qj_session")}catch(e){}
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("qj_"+k));localStorage.setItem("qj_"+k,JSON.stringify(v))}catch(e){return null}}
var toastEl=$("#toast"),tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove("on")},3200)}

function endSession(){clearInterval(notifTimer);TOKEN=null;try{localStorage.removeItem("qj_session")}catch(e){}}

/* ---------- API: every call carries the Telegram signature ---------- */
function api(path,opt){opt=opt||{};
  return fetch("/api/v1/admin"+path,{method:opt.method||"GET",headers:{"Authorization":"Bearer "+(TOKEN||""),"Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
    if(r.status===401||r.status===403){endSession();lock("Kirish yopiq","Sessiya tugagan yoki ruxsat yo‘q. Botdagi “🖥 Admin sayt” tugmasini qaytadan bosing.");throw new Error(j.detail||"Kirish yopiq")}
    if(!r.ok){var e=new Error(j.detail||("Xatolik: "+r.status));e.status=r.status;throw e}return j})})}
function fail(e){if($("#app").hidden)return;toast(e&&e.message?e.message:"Xatolik yuz berdi")}

/* ---------- constants ---------- */
var NAV=[["panel","Boshqaruv paneli","M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],
 ["foydalanuvchilar","Foydalanuvchilar","M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .6 3.2 2.3 3.5 5.2"],
 ["guruhlar","Guruhlar","M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"],
 ["fakultetlar","Fakultetlar","M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"],
 ["sorovlar","Jadval so‘rovlari","M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM7 8h10M7 12h10M7 16h6"],
 ["xabarlar","Xabarlar","M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"],
 ["sozlamalar","Sozlamalar","M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"]];
function ic(d){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"/></svg>'}
var PENCIL=ic("M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z");
var STATUS={APPROVED:["ok","Tasdiqlangan"],REJECTED:["bad","Rad etilgan"],ADMIN_REVIEW:["warn","Ko‘rib chiqish kerak"],NEEDS_CORRECTION:["idle","Talaba tuzatishi kerak"],AI_COMPLETED:["idle","AI tahlil qildi"],PENDING:["idle","Kutilmoqda"],AI_PROCESSING:["idle","AI o‘qiyapti"]};
var STG={done:["ok","Jadvali tayyor"],nosch:["warn","Jadval yubormagan"],nogr:["idle","Ro‘yxatdan o‘tishni tugatmagan"],teacher:["ok","O‘qituvchi"],pending:["warn","O‘qituvchi (tasdiq kutmoqda)"]};

/* ---------- state ---------- */
var S={me:null,unis:[],uni:null,ov:null,groups:null,subs:null};
var uState={q:"",stage:"",lang:"",page:1},gState={q:"",fac:"all",st:"all",sort:"users",dir:-1,page:1},pState={act:"day",grow:"day"};

/* ---------- dialog ---------- */
var dlg=$("#dlg"),dlgBody=$("#dlgBody");
function openDlg(html,wide){dlg.classList.toggle("wide",!!wide);dlg.classList.remove("narrow");dlgBody.innerHTML=html;if(!dlg.open){try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}}}

  openDlg('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="acts"><button class="btn" type="button" data-dlg="x">Bekor qilish</button><button class="btn '+(danger?'danger':'primary')+'" type="button" data-dlg="ok">'+esc(okLabel)+'</button></div>');
  dlgBody._ok=onOk}
dlg.addEventListener("click",function(e){var b=e.target.closest("[data-dlg]");if(b){var ok=b.dataset.dlg==="ok",f=dlgBody._ok;dlgBody._ok=null;closeDlg();if(ok&&f)f();return}if(e.target===dlg)closeDlg()});

/* ---------- charts (one scale each) ---------- */
var CIR=function(r){return 2*Math.PI*r};
function ring(pct,color,label,sub,go){var C=CIR(34);
  return '<button class="ring" type="button" data-act="req-filter" data-s="'+go+'" aria-label="'+esc(label)+': '+pct+' foiz"><span class="box"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--track)" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(pct/100*C).toFixed(1)+' '+C.toFixed(1)+'"/></svg><span class="rv">'+pct+'%</span></span><span class="l">'+esc(label)+'</span><small>'+esc(sub)+'</small></button>'}
function donut(parts,mid,midSub){var r=50,C=CIR(r),off=0,out="";
  parts.forEach(function(p){if(!p.v)return;var len=p.v/p.t*C;out+='<circle class="hit" data-tip="'+esc(p.n)+': '+p.v+'" cx="60" cy="60" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="15" stroke-dasharray="'+Math.max(len-1.5,0.5).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'"/>';off+=len});
  return '<div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="'+esc(parts.map(function(p){return p.n+" "+p.v}).join(", "))+'"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="15"/>'+out+'</svg><div class="mid"><b>'+esc(mid)+'</b><span>'+esc(midSub)+'</span></div></div>'}
function pad(n){return (n<10?"0":"")+n}
function ymd(s){var a=s.split("-");return Date.UTC(+a[0],+a[1]-1,+a[2])}
var PNAME={day:"kunlik",week:"haftalik",month:"oylik"},ACT={act:null,grow:null},DATE="";
function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayISO(){return isoOf(new Date())}
function dateLabel(s){var a=s.split("-");return +a[2]+"-"+MON[+a[1]-1].toLowerCase()+", "+a[0]}
function shortD(s){var a=s.split("-");return pad(+a[2])+"."+pad(+a[1])+"."+a[0]}
function rangeLabel(d,p){if(p==="day")return dateLabel(d.start);if(p==="month"){var a=d.start.split("-");return MON[+a[1]-1]+" "+a[0]}return shortD(d.start)+" – "+shortD(d.end)}
function loadAct(k){var seq=routeSeq,d=DATE,p=pState[k];ACT[k]=null;var el=$(k==="act"?"#card-act":"#card-grow");if(el)el.innerHTML=k==="act"?actInner():growInner();
  api("/activity?uni="+S.uni.id+"&period="+p+"&day="+d).then(function(r){if(seq!==routeSeq||d!==DATE||p!==pState[k])return;ACT[k]=r;var e2=$(k==="act"?"#card-act":"#card-grow");if(e2)e2.innerHTML=k==="act"?actInner():growInner()}).catch(fail)}
function applyDate(){S.ov=null;route()}
/* calendar: month grid, Monday first */
var CAL={y:0,m:0};
function calOpen(){var a=DATE.split("-");CAL.y=+a[0];CAL.m=+a[1]-1;calDraw()}
function calDraw(){var first=new Date(CAL.y,CAL.m,1),off=(first.getDay()+6)%7,days=new Date(CAL.y,CAL.m+1,0).getDate(),today=todayISO(),cells="";
  ["Du","Se","Ch","Pa","Ju","Sh","Ya"].forEach(function(w){cells+='<span class="wd">'+w+'</span>'});
  for(var i=0;i<off;i++)cells+='<span></span>';
  for(var d=1;d<=days;d++){var iso=CAL.y+"-"+pad(CAL.m+1)+"-"+pad(d);cells+='<button type="button" data-cal-day="'+iso+'"'+(iso>today?" disabled":"")+' class="'+(iso===DATE?"sel ":"")+(iso===today?"today":"")+'" aria-label="'+esc(dateLabel(iso))+'">'+d+'</button>'}
  var yr=new Date().getFullYear(),ys="";for(var y=yr-3;y<=yr;y++)ys+='<option value="'+y+'"'+(y===CAL.y?" selected":"")+'>'+y+'</option>';
  var ms=MON.map(function(n,i){return '<option value="'+i+'"'+(i===CAL.m?" selected":"")+'>'+n+'</option>'}).join("");
  openDlg('<div class="cal"><div class="cal-pre"><b style="flex:1;align-self:center">Sanani tanlang</b><button class="btn sm" type="button" data-act="cal-today">Bugun</button><button class="btn sm" type="button" data-act="cal-yday">Kecha</button></div><div class="cal-top"><button class="cal-nav" type="button" data-cal-nav="-1" aria-label="Oldingi oy">‹</button><select class="sel" id="calM" aria-label="Oy">'+ms+'</select><select class="sel" id="calY" aria-label="Yil">'+ys+'</select><button class="cal-nav" type="button" data-cal-nav="1" aria-label="Keyingi oy">›</button></div><div class="cal-grid">'+cells+'</div></div>');dlg.classList.add("narrow")}
function calMove(n){CAL.m+=n;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}calDraw()}
dlg.addEventListener("change",function(e){if(e.target.id==="calM"){CAL.m=+e.target.value;calDraw()}else if(e.target.id==="calY"){CAL.y=+e.target.value;calDraw()}});
function niceAxis(max){var steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000],step=steps.filter(function(s){return max/s<=5})[0]||10000,top=Math.ceil(max/step)*step,tk=[];for(var v=0;v<=top;v+=step)tk.push(v);return {max:top||1,ticks:tk}}
function perSeg(key){return '<div class="seg per" role="group" aria-label="Davr">'+[["day","Kunlik"],["week","Haftalik"],["month","Oylik"]].map(function(o){return '<button type="button" data-per="'+key+'" data-v="'+o[0]+'" aria-pressed="'+(pState[key]===o[0])+'">'+o[1]+'</button>'}).join("")+'</div>'}
function bars(a){var d={l:a.labels,u:a.users,r:a.reqs},p=a.period,n=d.l.length,W=560,H=250,L=44,B=28,T=14,ax=niceAxis(Math.max.apply(null,d.u.concat(d.r))),ph=H-B-T,gw=(W-L-10)/n,out="",every=n>8?Math.ceil(n/8):1;
  ax.ticks.forEach(function(t){var y=T+ph-t/ax.max*ph;out+='<line class="gl" x1="'+L+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+t+'</text>'});
  d.l.forEach(function(lb,i){var x=L+i*gw+gw/2,bw=Math.min(34,gw/4),h1=d.u[i]/ax.max*ph,h2=d.r[i]/ax.max*ph;
    out+='<rect class="hit" data-tip="'+lb+' · yangi foydalanuvchi: '+d.u[i]+'" x="'+(x-bw-2)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" rx="4" fill="var(--accent)"/>';
    out+='<rect class="hit" data-tip="'+lb+' · jadval so‘rovi: '+d.r[i]+'" x="'+(x+2)+'" y="'+(T+ph-h2)+'" width="'+bw+'" height="'+h2+'" rx="4" fill="var(--violet)"/>';

function userDialog(u){
  openDlg('<h2>'+esc(u.name)+'</h2><div><div class="kv"><span>Username</span><b>'+(u.username?"@"+esc(u.username):"yo‘q")+'</b></div><div class="kv"><span>Telegram ID</span><b>'+u.telegram_id+'</b></div><div class="kv"><span>Til</span><b>'+(LNAME[u.lang]||esc(u.lang))+'</b></div><div class="kv"><span>Universitet</span><b>'+esc(u.university||"—")+'</b></div><div class="kv"><span>Fakultet</span><b>'+esc(u.faculty||"—")+'</b></div><div class="kv"><span>Guruh</span><b>'+esc(u.group||"—")+'</b></div><div class="kv"><span>Bosqich</span>'+pill(STG[u.stage][0],STG[u.stage][1])+'</div><div class="kv"><span>Jadval so‘rovlari</span><b>'+u.requests+'</b></div><div class="kv"><span>Ro‘yxatdan o‘tgan</span><b>'+esc(u.created)+'</b></div><div class="kv"><span>Holat</span>'+(u.active?pill("ok","Faol"):pill("bad","Bloklangan"))+'</div></div>'+
  '<div class="acts"><button class="btn" type="button" data-dlg="x">Yopish</button>'+(u.is_admin?"":(u.active?'<button class="btn danger" type="button" data-act="block-user" data-id="'+u.id+'">Bloklash</button>':'<button class="btn" type="button" data-act="unblock-user" data-id="'+u.id+'">Blokdan chiqarish</button>'))+'<button class="btn primary" type="button" data-act="msg-user" data-id="'+u.id+'" data-name="'+esc(u.name)+'" data-stage="'+u.stage+'" data-lang="'+esc(u.lang)+'">Xabar yozish</button></div>')}

document.addEventListener("click",function(e){
  var pb=e.target.closest("[data-per]");
  if(pb){var k=pb.dataset.per;pState[k]=pb.dataset.v;loadAct(k);return}
  var cd=e.target.closest("[data-cal-day]");if(cd){DATE=cd.dataset.calDay;closeDlg();applyDate();return}
  var cn=e.target.closest("[data-cal-nav]");if(cn){calMove(+cn.dataset.calNav);return}
  var th=e.target.closest("button[data-th]");
  if(th){SET.theme=th.dataset.th;store("theme",SET.theme);applyTheme();$$("button[data-th]").forEach(function(x){x.setAttribute("aria-pressed",x===th?"true":"false")});toast("Saqlandi");return}
  var g=e.target.closest("[data-go]");if(g){closeDlg();go(g.dataset.go);return}
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,id=+b.dataset.id;if(b.closest("#bellPop"))pop($("#bellBtn"),$("#bellPop"),false);
  if(a==="cal-open"){calOpen()}
  else if(a==="cal-today"){DATE=todayISO();closeDlg();applyDate()}
  else if(a==="cal-yday"){var yd=new Date();yd.setDate(yd.getDate()-1);DATE=isoOf(yd);closeDlg();applyDate()}
  else if(a==="users-stage"){uState.stage=b.dataset.s;uState.page=1;uState.q="";uState.lang="";go("foydalanuvchilar")}
  else if(a==="req-filter"){rState.status=b.dataset.s||"";if(location.hash==="#sorovlar")route();else go("sorovlar")}
  else if(a==="open-fac"){gState.fac=b.dataset.f;gState.q="";gState.st="all";gState.page=1;go("guruhlar")}
  else if(a==="group-info"){var gr=S.groups.filter(function(x){return x.id===id})[0],has=gr.subjects>0;
    openDlg('<h2>Guruh '+esc(gr.name)+'</h2><div><div class="kv"><span>Fakultet</span><b>'+esc(gl(gr))+'</b></div><div class="kv"><span>Foydalanuvchilar</span><b>'+gr.users+'</b></div><div class="kv"><span>Fanlar</span><b>'+(has?gr.subjects:"—")+'</b></div><div class="kv"><span>Faol darslar</span><b>'+gr.lessons+'</b></div><div class="kv"><span>Holat</span>'+(has?pill("ok","Jadval bor"):pill("idle","Jadval yo‘q"))+'</div></div><div class="acts"><button class="btn" type="button" data-dlg="x">Yopish</button>'+(!has&&gr.users?'<button class="btn primary" type="button" data-act="remind-group" data-id="'+gr.id+'">Eslatish</button>':"")+'</div>')}
  else if(a==="remind-group"){var g2=S.groups.filter(function(x){return x.id===id})[0];
    confirmDlg("Eslatma yuborilsinmi?","Guruh "+g2.name+" a’zolariga ("+g2.users+" kishi) jadval rasmini yuborish haqida xabar boradi.","Yuborish",function(){
      toast("Yuborilmoqda…");api("/groups/"+id+"/remind",{method:"POST"}).then(function(r){toast(r.total+" kishidan "+r.sent+" tasiga yetib bordi")}).catch(fail)})}
  else if(a==="user-info"){api("/users/"+id).then(userDialog).catch(fail)}
  else if(a==="block-user"||a==="unblock-user"){var bl=a==="block-user";
    confirmDlg(bl?"Foydalanuvchini bloklash":"Blokdan chiqarish",bl?"Bloklangan foydalanuvchi botdan foydalana olmaydi, eslatma va xabarlar unga bormaydi. Keyin qaytarish mumkin.":"Foydalanuvchi botdan yana foydalana oladi.",bl?"Bloklash":"Blokdan chiqarish",function(){
      api("/users/"+id+"/block",{method:"POST",body:{blocked:bl}}).then(function(){toast(bl?"Bloklandi":"Blokdan chiqarildi");if(location.hash==="#foydalanuvchilar")route()}).catch(fail)},bl)}
  else if(a==="msg-user"){var nm=b.dataset.name||"";
    openDlg('<h2>Xabar: '+esc(nm)+'</h2><p>Holatiga mos tayyor matn qo‘yildi (<b>'+esc(STG[b.dataset.stage||"done"]?STG[b.dataset.stage||"done"][1]:"")+'</b>). Mos kelsa “Yuborish”ni bosing, yoqmasa o‘zgartiring yoki “Tozalash” bilan o‘chirib o‘zingiznikini yozing.</p><label for="um" style="position:absolute;left:-9999px">Xabar matni</label><textarea class="ta" id="um" maxlength="4000" placeholder="Xabar matni">'+esc(userTpl(b.dataset.stage,b.dataset.lang))+'</textarea><div class="acts"><button class="btn" type="button" data-act="um-clear">Tozalash</button><button class="btn" type="button" data-dlg="x">Bekor qilish</button><button class="btn primary" type="button" data-act="msg-send" data-id="'+id+'">Yuborish</button></div>');setTimeout(function(){var t=$("#um");if(t)t.focus()},50)}
  else if(a==="um-clear"){var ut=$("#um");if(ut){ut.value="";ut.focus()}}
  else if(a==="msg-send"){var tx=($("#um")||{}).value||"";if(!tx.trim()){toast("Avval xabar matnini yozing");return}b.disabled=true;
    api("/users/"+id+"/message",{method:"POST",body:{text:tx}}).then(function(r){closeDlg();toast(r.status==="ok"?"Xabar yuborildi":"Yetib bormadi: foydalanuvchi botni bloklagan yoki ishga tushirmagan")}).catch(function(e){b.disabled=false;fail(e)})}
  else if(a==="req-more"){b.disabled=true;api("/submissions?uni="+S.uni.id+"&status="+encodeURIComponent(rParam())+"&offset="+S.subs.length).then(function(r){S.subs=S.subs.concat(r);S.subsMore=r.length>=50;$("#view").innerHTML=viewReq()}).catch(function(e){b.disabled=false;fail(e)})}
  else if(a==="req-view"){pop($("#bellBtn"),$("#bellPop"),false);openSub(id)}
  else if(a==="req-ok"){review(id,true)}
  else if(a==="req-bad"){rejectDlg(id)}
  else if(a==="rej-chip"){var rj=$("#rj");if(rj){rj.value=(rj.value.trim()?rj.value.replace(/\s+$/,"")+". ":"")+REASONS[+b.dataset.i];rj.focus()}}
  else if(a==="rej-send"){var why=(($("#rj")||{}).value||"").trim();if(!why){toast("Avval nima xato ekanini yozing");return}b.disabled=true;
    api("/submissions/"+id+"/review",{method:"POST",body:{action:"reject",reason:why}}).then(function(r){closeDlg();toast(r.notified?"Rad etildi, talabaga xato matni yuborildi":"Rad etildi");reloadSubs()}).catch(function(e){b.disabled=false;fail(e)})}
  else if(a==="rv-edit"){RV.draft=RV.sub.lessons.map(function(l){return Object.assign({},l)});RV.edit=true;drawRV()}
  else if(a==="rv-cancel"){RV.edit=false;RV.draft=null;drawRV()}
  else if(a==="rv-add"){RV.draft.push({day:"Dushanba",start_time:"",end_time:"",subject:"",room:"",teacher:"",week_parity:"ALL",lesson_type:"OTHER",_b:"",_r:""});drawRV()}
  else if(a==="rv-del"){RV.draft.splice(+b.dataset.i,1);drawRV()}
  else if(a==="rv-save"){b.disabled=true;
    api("/submissions/"+RV.sub.id+"/lessons",{method:"PUT",body:{lessons:RV.draft}}).then(function(r){RV={sub:r.submission,edit:false,draft:null};drawRV();
      toast(r.applied?("Saqlandi. Guruh jadvali yangilandi ("+r.applied+" dars)"):("Saqlandi ("+r.saved+" dars)"));reloadSubs()}).catch(function(e){b.disabled=false;fail(e)})}
  else if(a==="tpl"){$("#mt").value=TPL[mState.lang];$("#mt").dispatchEvent(new Event("input"));toast("Namuna qo‘yildi")}
  else if(a==="send"){var txt=$("#mt").value.trim();if(!txt){toast("Avval xabar matnini yozing");return}
    var k=mState.aud,n=MSG.aud[k]||0;if(!n){toast("Bu guruhda hech kim yo‘q");return}
    confirmDlg("Xabar yuborilsinmi?",n+" kishiga ("+AUDN[k][0].toLowerCase()+") xabar yuboriladi. Buni qaytarib bo‘lmaydi.","Yuborish",function(){
      api("/broadcast",{method:"POST",body:{uni:S.uni.id,audience:k,text:txt}}).then(function(j){
        var now=new Date();MSG.hist.push({id:j.id,text:txt,created:pad(now.getDate())+"."+pad(now.getMonth()+1)+" "+pad(now.getHours())+":"+pad(now.getMinutes()),audience:k,total:j.total,sent:0,blocked:0,failed:0,done:false});
        drawMsgs();toast("Yuborish boshlandi: "+j.total+" kishi");pollJob(j.id)}).catch(fail)})}
});

/* ---------- start: one-time link from the bot -> session ---------- */
applyTheme();
function boot(){
  Promise.all([api("/me"),api("/universities")]).then(function(r){S.me=r[0];S.unis=[{id:0,name:"Barcha universitetlar",short:"Hammasi",users:0}].concat(r[1]);
    $("#lock").hidden=true;$("#app").hidden=false;$("#meName").textContent=S.me.name||"Admin";$("#meSub").textContent=S.me.username?"@"+S.me.username:"admin";$("#meAv").textContent=(S.me.name||"A").charAt(0);
    $("#uni").innerHTML=S.unis.map(function(u){return '<option value="'+u.id+'" title="'+esc(u.name)+'">'+esc(u.short)+'</option>'}).join("");
    var saved=store("uni");return loadUni(S.unis.some(function(u){return u.id===saved})?saved:0).then(function(){if(S.uni)$("#uni").value=String(S.uni.id);route();pollNotif(true);clearInterval(notifTimer);notifTimer=setInterval(pollNotif,20000)})}).catch(function(e){if(!$("#lock").hidden)return;lock("Xatolik",e.message||"Ma’lumotni yuklab bo‘lmadi")})}
var link=/^#login=(.+)$/.exec(location.hash||"");
if(link){
  history.replaceState(null,"",location.pathname+location.search);
  fetch("/api/v1/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:link[1]})})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
    if(!r.ok||!j.session){lock("Havola ishlamaydi","Bu havola eskirgan (5 daqiqadan oshgan) yoki oldin ishlatilgan. Botdagi “🖥 Admin sayt” tugmasini qaytadan bosing.");return}
    TOKEN=j.session;try{localStorage.setItem("qj_session",TOKEN)}catch(e){}boot()})})
  .catch(function(){lock("Xatolik","Serverga ulanib bo‘lmadi. Birozdan keyin qayta urinib ko‘ring.")});
}else if(TOKEN){boot()}
else{lock("Faqat bot orqali","Bu sayt faqat Qulay Jadval botidagi “🖥 Admin sayt” tugmasi orqali ochiladi.")}
})();
